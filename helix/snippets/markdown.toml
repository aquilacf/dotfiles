[[snippets]]
prefix = "okf"
scope = ["markdown"]
description = "Google Cloud Open Knowledge Format document"
body = '''
---
type: ${1:Type name}
title: ${2:Title}
description: ${3:Short description}
resource: ${4:https://example.com/resource}
tags:
  - ${5:tag}
sources:
  - id: ${6:source-id}
    resource: ${7:https://example.com/source}
    title: ${8:Source title}
    author: ${9:human:username}
    usage_count: ${10:0}
    last_modified: ${11:YYYY-MM-DD}
usage_window:
  from: ${12:YYYY-MM-DD}
  to: ${13:YYYY-MM-DD}
generated:
  by: human:aquilacf
  at: ${14:YYYY-MM-DDTHH:MM:SSZ}
verified:
  - by: human:aquilacf
    at: ${15:YYYY-MM-DDTHH:MM:SSZ}
status: ${16:draft}
stale_after: ${17:YYYY-MM-DD}
---

## ${2}
$0
'''

[[snippets]]
prefix = "okf-daily"
scope = ["markdown"]
description = "Google Cloud Open Knowledge Format daily note"
body = '''
---
type: Daily Note
title: ${1:YYYY-MM-DD}
description: Daily note for ${1}
generated:
  by: human:aquilacf
  at: ${3:YYYY-MM-DDTHH:MM:SSZ}
tags:
  - ${4:tag}
status: ${5:draft}
---

## ${1}
$0
'''
